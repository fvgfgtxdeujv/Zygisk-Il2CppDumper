name: Auto Build (Dev Branch)

on:
  workflow_dispatch:  # 手动触发，不需要输入参数
  push:
    branches: [ dev ]  # 推送到dev分支时自动触发
  pull_request:
    branches: [ dev ]  # 向dev分支提交PR时触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: dev  # 使用dev分支
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build module
      run: |
        chmod +x ./gradlew
        echo "Building Zygisk-Il2CppDumper from dev branch..."
        echo "Note: This build uses config file mode."
        echo "Target packages should be configured in /data/adb/target_packages.txt"
        ./gradlew :module:assembleRelease
        echo "Build completed!"
    
    - name: List output files
      run: |
        echo "Build output directory structure:"
        find out/ -type f -name "*.zip" -o -name "*.apk" 2>/dev/null || echo "No output files found"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper-dev
        path: out/magisk_module_release/
        if-no-files-found: error
    
    - name: Generate build info
      run: |
        echo "Build Summary:" > build-info.txt
        echo "==============" >> build-info.txt
        echo "Branch: dev" >> build-info.txt
        echo "Commit: ${{ github.sha }}" >> build-info.txt
        echo "Build Date: $(date)" >> build-info.txt
        echo "Workflow: ${{ github.workflow }}" >> build-info.txt
        echo "" >> build-info.txt
        echo "Features:" >> build-info.txt
        echo "- Config file mode enabled" >> build-info.txt
        echo "- Supports multiple target packages" >> build-info.txt
        echo "- No hardcoded package names" >> build-info.txt
        echo "" >> build-info.txt
        echo "Usage:" >> build-info.txt
        echo "1. Install the module in Magisk" >> build-info.txt
        echo "2. Create /data/adb/target_packages.txt with target package names" >> build-info.txt
        echo "3. Each line should contain one package name" >> build-info.txt
        echo "4. Lines starting with # are treated as comments" >> build-info.txt
    
    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build-info.txt