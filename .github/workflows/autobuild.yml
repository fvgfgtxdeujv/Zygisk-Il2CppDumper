name: Auto Build (Dev Branch)

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 解决 Node.js 20 弃用警告
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: dev
        fetch-depth: 0  # 建议：获取完整历史，某些构建可能需要
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17  # 建议：Android Gradle Plugin 8+ 需要 Java 17
        cache: gradle
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3  # 官方推荐，优化 Gradle 缓存
    
    - name: Build module
      run: |
        chmod +x ./gradlew
        echo "Building Zygisk-Il2CppDumper from dev branch..."
        ./gradlew :module:assembleRelease --no-daemon --stacktrace
    
    - name: Verify output
      run: |
        echo "=== Build Output ==="
        find . -name "*.zip" -o -name "*.apk" 2>/dev/null | head -20
        
        echo "=== Module Directory ==="
        ls -la out/magisk_module_release/ 2>/dev/null || echo "Directory not found"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper-dev
        path: out/magisk_module_release/
        if-no-files-found: error
    
    - name: Generate build info
      run: |
        cat > build-info.txt << 'EOF'
        Build Summary
        =============
        Branch: dev
        Commit: ${{ github.sha }}
        Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Workflow: ${{ github.workflow }}
        
        Features:
        - Config file mode enabled
        - Supports multiple target packages
        
        Usage:
        1. Install module in Magisk
        2. Create /data/adb/target_packages.txt
        3. Add one package name per line
        EOF
    
    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build-info.txt