name: Auto Build (Dev Branch)

on:
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip cache restoration'
        required: false
        default: false
        type: boolean
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        ref: dev  # 使用dev分支
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.2.2
      with:
        cmdline-tools-version: 11076708  # 使用最新的cmdline-tools版本
        accept-android-sdk-licenses: true  # 自动接受许可证
        packages: >-
          platform-tools
          platforms;android-34
          build-tools;34.0.0
          ndk;26.2.11394342
    
    - name: Set up Java
      uses: actions/setup-java@v4.8.0
      with:
        distribution: temurin
        java-version: 11
        cache: ${{ github.event_name == 'push' && 'gradle' || '' }}
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5
    
    - name: Build module
      run: |
        chmod +x ./gradlew
        echo "Building Zygisk-Il2CppDumper from dev branch..."
        echo "Note: This build uses config file mode."
        echo "Target packages should be configured in /data/adb/target_packages.txt"
        ./gradlew :module:assembleRelease --stacktrace --no-daemon
        echo "Build completed!"
    
    - name: List output files
      run: |
        echo "Build output directory structure:"
        ls -la out/ || echo "out/ directory not found"
        find out/ -type f -name "*.zip" -o -name "*.apk" 2>/dev/null || echo "No output files found"
    
    - name: Generate build info
      run: |
        echo "Build Summary:" > build-info.txt
        echo "==============" >> build-info.txt
        echo "Branch: dev" >> build-info.txt
        echo "Commit: ${{ github.sha }}" >> build-info.txt
        echo "Build Date: $(date)" >> build-info.txt
        echo "Workflow: ${{ github.workflow }}" >> build-info.txt
        echo "" >> build-info.txt
        echo "Build Environment:" >> build-info.txt
        echo "- Node.js 24 (enforced)" >> build-info.txt
        echo "- Android SDK API 34" >> build-info.txt
        echo "- NDK 26.2.11394342" >> build-info.txt
        echo "- Java 11 (Temurin)" >> build-info.txt
        echo "- Gradle 8.5" >> build-info.txt
        echo "" >> build-info.txt
        echo "Features:" >> build-info.txt
        echo "- Config file mode enabled" >> build-info.txt
        echo "- Supports multiple target packages" >> build-info.txt
        echo "- No hardcoded package names" >> build-info.txt
        echo "" >> build-info.txt
        echo "Usage:" >> build-info.txt
        echo "1. Install the module in Magisk" >> build-info.txt
        echo "2. Create /data/adb/target_packages.txt with target package names" >> build-info.txt
        echo "3. Each line should contain one package name" >> build-info.txt
        echo "4. Lines starting with # are treated as comments" >> build-info.txt
        echo "" >> build-info.txt
        echo "GitHub Actions Details:" >> build-info.txt
        echo "Run ID: ${{ github.run_id }}" >> build-info.txt
        echo "Run Number: ${{ github.run_number }}" >> build-info.txt
        echo "Triggered by: ${{ github.event_name }}" >> build-info.txt
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4.6.0
      with:
        name: zygisk-il2cppdumper-dev-${{ github.sha }}
        path: |
          out/magisk_module_release/
          build-info.txt
        if-no-files-found: error
        retention-days: 7
    
    - name: Upload build info separately
      uses: actions/upload-artifact@v4.6.0
      with:
        name: build-info
        path: build-info.txt
        retention-days: 30