name: Build 8Ball Dumper 2026
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
    - name: Inject 8 Ball Pool Target
      run: |
        chmod +x ./gradlew
        # هنا التعديل السحري: وضعنا اسم اللعبة مباشرة
        sed -i 's/moduleDescription = "/moduleDescription = "(com.miniclip.eightballpool) /g' module.gradle
        sed -i "s/com.game.packagename/com.miniclip.eightballpool/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease
    - name: Upload Dumper
      uses: actions/upload-artifact@v4
      with:
        name: Zygisk-Dumper-8BP-2026
        path: out/magisk_module_release/
